<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Выживание (Оптимизация)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: sans-serif; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }

        /* Верхняя панель инвентаря */
        #hud {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0, 0, 0, 0.6); color: white;
            padding: 8px 14px; border-radius: 10px; font-size: 15px;
            pointer-events: none; border: 1px solid rgba(255,255,255,0.2);
            z-index: 10;
        }

        /* Прицел по центру */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 6px; height: 6px; background: rgba(255, 255, 255, 0.8);
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; border: 1px solid rgba(0,0,0,0.5);
        }

        /* 3D-подпись над предметом (всплывающий стилизованный текст) */
        #item-label {
            display: none; position: absolute;
            background: rgba(20, 20, 20, 0.85); color: #ffcc00;
            padding: 5px 12px; border-radius: 6px; font-size: 14px; font-weight: bold;
            transform: translate(-50%, -100%); pointer-events: none;
            border: 1px solid #ff9800; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            white-space: nowrap; z-index: 10;
            transition: transform 0.05s linear;
        }

        /* Визуал левого джойстика */
        #joy-base {
            display: none; position: absolute; width: 110px; height: 110px;
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
        }
        #joy-stick {
            position: absolute; top: 50%; left: 50%; width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.7); border-radius: 50%;
            transform: translate(-50%, -50%); box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Подсказка снизу */
        #hint {
            position: absolute; bottom: 8px; left: 15px; color: rgba(255,255,255,0.7);
            font-size: 11px; pointer-events: none; text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

<div id="hud">🪵 Дерево: <span id="wood">0</span> | 🪨 Камень: <span id="stone">0</span></div>
<div id="crosshair"></div>
<div id="item-label">🪨 Камень</div>

<div id="joy-base"><div id="joy-stick"></div></div>
<div id="hint">Левая половина — ходьба | Правая половина — обзор (наведи на предмет для подбора)</div>

<!-- Подключаем Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // 1. СЦЕНА И КАМЕРА
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 15, 60);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.7, 0);
    camera.rotation.order = 'YXZ';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // 2. СВЕТ
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // 3. ЗЕМЛЯ
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(150, 150),
        new THREE.MeshLambertMaterial({ color: 0x4caf50 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 4. СПАВН РЕСУРСОВ (С УВЕЛИЧЕННЫМ ХИТБОКСОМ)
    const items = [];
    const woodGeo = new THREE.BoxGeometry(0.9, 0.5, 0.5);
    const woodMat = new THREE.MeshLambertMaterial({ color: 0x8d5524 });
    const stoneGeo = new THREE.DodecahedronGeometry(0.5);
    const stoneMat = new THREE.MeshLambertMaterial({ color: 0x808080 });

    function spawnResources() {
        for (let i = 0; i < 35; i++) {
            const isWood = Math.random() > 0.5;
            const mesh = new THREE.Mesh(isWood ? woodGeo : stoneGeo, isWood ? woodMat : stoneMat);
            mesh.position.set(
                (Math.random() - 0.5) * 60,
                0.25,
                (Math.random() - 0.5) * 60
            );
            mesh.rotation.y = Math.random() * Math.PI;
            
            // Задаем тип и русское название для красивой плашки
            mesh.userData = { 
                type: isWood ? 'wood' : 'stone',
                name: isWood ? '🪵 Дерево' : '🪨 Камень'
            };
            
            scene.add(mesh);
            items.push(mesh);
        }
    }
    spawnResources();

    // 5. УПРАВЛЕНИЕ (ДЖОЙСТИК СЛЕВА, ОБЗОР СПРАВА)
    let moveInput = { x: 0, z: 0 };
    let yaw = 0, pitch = 0;
    let joyTouchId = null, lookTouchId = null;
    let joyStart = { x: 0, y: 0 }, lookLast = { x: 0, y: 0 };

    const joyBase = document.getElementById('joy-base');
    const joyStick = document.getElementById('joy-stick');

    window.addEventListener('touchstart', (e) => {
        for (let touch of e.changedTouches) {
            if (touch.clientX < window.innerWidth / 2 && joyTouchId === null) {
                joyTouchId = touch.identifier;
                joyStart = { x: touch.clientX, y: touch.clientY };
                joyBase.style.display = 'block';
                joyBase.style.left = touch.clientX + 'px';
                joyBase.style.top = touch.clientY + 'px';
                joyStick.style.transform = 'translate(-50%, -50%)';
            } else if (touch.clientX >= window.innerWidth / 2 && lookTouchId === null) {
                lookTouchId = touch.identifier;
                lookLast = { x: touch.clientX, y: touch.clientY };
            }
        }
    });

    window.addEventListener('touchmove', (e) => {
        for (let touch of e.changedTouches) {
            if (touch.identifier === joyTouchId) {
                const maxDist = 45;
                let dx = touch.clientX - joyStart.x;
                let dy = touch.clientY - joyStart.y;
                const dist = Math.hypot(dx, dy);
                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }
                joyStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                moveInput.x = dx / maxDist;
                moveInput.z = dy / maxDist;
            }
            if (touch.identifier === lookTouchId) {
                const dx = touch.clientX - lookLast.x;
                const dy = touch.clientY - lookLast.y;
                lookLast = { x: touch.clientX, y: touch.clientY };

                yaw -= dx * 0.005;
                pitch -= dy * 0.005;
                pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
            }
        }
    });

    window.addEventListener('touchend', (e) => {
        for (let touch of e.changedTouches) {
            if (touch.identifier === joyTouchId) {
                joyTouchId = null;
                moveInput = { x: 0, z: 0 };
                joyBase.style.display = 'none';
            }
            if (touch.identifier === lookTouchId) {
                lookTouchId = null;
            }
        }
    });

    // 6. ИНВЕНТАРЬ И АВТОПОДБОР ПРИ НАВЕДЕНИИ
    let inventory = { wood: 0, stone: 0 };
    const itemLabel = document.getElementById('item-label');
    const raycaster = new THREE.Raycaster();
    const centerScreen = new THREE.Vector2(0, 0); // Центр экрана (где прицел)

    const speed = 0.12;
    function animate() {
        requestAnimationFrame(animate);

        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        // Плавное движение
        if (moveInput.x !== 0 || moveInput.z !== 0) {
            const forwardX = -Math.sin(yaw);
            const forwardZ = -Math.cos(yaw);
            const rightX = Math.cos(yaw);
            const rightZ = -Math.sin(yaw);

            camera.position.x += (forwardX * -moveInput.z + rightX * moveInput.x) * speed;
            camera.position.z += (forwardZ * -moveInput.z + rightZ * moveInput.x) * speed;
        }

        // Проверяем, на что смотрит центр экрана (Raycast)
        raycaster.setFromCamera(centerScreen, camera);
        const intersects = raycaster.intersectObjects(items);

        let targetedItem = null;
        if (intersects.length > 0) {
            const hit = intersects[0];
            // Проверяем расстояние (чтобы подбирать только вблизи, в радиусе 3 метров)
            const dist = camera.position.distanceTo(hit.object.position);
            if (dist < 3.0) {
                targetedItem = hit.object;
            }
        }

        if (targetedItem) {
            // Показываем стильную плашку над предметом
            itemLabel.innerText = "⚡ Взять: " + targetedItem.userData.name;
            itemLabel.style.display = 'block';

            // Переводим 3D-координаты предмета в координаты на экране телефона
            const tempVector = targetedItem.position.clone();
            tempVector.project(camera);
            const x = (tempVector.x *  .5 + .5) * window.innerWidth;
            const y = (tempVector.y * -.5 + .5) * window.innerHeight;
            itemLabel.style.left = x + 'px';
            itemLabel.style.top = (y - 30) + 'px';

            // АВТОПОДБОР: как только игрок навёл прицел и подошёл близко — предмет забирается в инвентарь!
            inventory[targetedItem.userData.type]++;
            document.getElementById('wood').innerText = inventory.wood;
            document.getElementById('stone').innerText = inventory.stone;

            scene.remove(targetedItem);
            items.splice(items.indexOf(targetedItem), 1);
        } else {
            itemLabel.style.display = 'none';
        }

        renderer.render(scene, camera);
    }

    // Адаптация под поворот экрана
    window.innerWidth = window.innerWidth;
    window.innerHeight = window.innerHeight;

    animate();
</script>
</body>
</html>
