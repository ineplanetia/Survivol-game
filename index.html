<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Остров — выживание</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
      color: #fff;
      font-family: system-ui, sans-serif;
      user-select: none;
      touch-action: none;
    }

    canvas { display: block; }

    button {
      color: white;
      font: inherit;
      font-weight: 700;
      border: 0;
      cursor: pointer;
      touch-action: none;
    }

    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 14px;
      height: 14px;
      transform: translate(-50%, -50%);
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: white;
      border-radius: 2px;
      box-shadow: 0 1px 3px #222;
    }

    #crosshair::before {
      width: 2px;
      height: 14px;
      left: 6px;
    }

    #crosshair::after {
      height: 2px;
      width: 14px;
      top: 6px;
    }

    #targetBox {
      position: absolute;
      top: calc(50% + 24px);
      left: 50%;
      display: none;
      min-width: 150px;
      padding: 8px 12px;
      transform: translateX(-50%);
      border: 1px solid #ffffff55;
      border-radius: 10px;
      background: #17231ee8;
      text-align: center;
      pointer-events: auto;
    }

    #targetName {
      margin-bottom: 5px;
      font-weight: 700;
    }

    #interact {
      padding: 8px 15px;
      border-radius: 9px;
      background: #468e52;
    }

    #joystick {
      position: absolute;
      display: none;
      width: 150px;
      height: 150px;
      transform: translate(-50%, -50%);
      border: 2px solid #ffffff70;
      border-radius: 50%;
      background: #16231d55;
      pointer-events: none;
    }

    #stick {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 66px;
      height: 66px;
      margin: -33px;
      border: 2px solid #fff;
      border-radius: 50%;
      background: #ffffffaa;
    }

    #jump {
      position: absolute;
      right: 24px;
      bottom: 26px;
      display: grid;
      width: 84px;
      height: 84px;
      place-items: center;
      border: 3px solid #ffffffbb;
      border-radius: 50%;
      background: linear-gradient(145deg, #70c4ff, #287ac0);
      box-shadow:
        0 6px 0 #174d7d,
        0 8px 18px #0006,
        inset 0 3px 8px #ffffff66;
      font-size: 13px;
      text-shadow: 0 1px 2px #174d7d;
      pointer-events: auto;
    }

    #jump:active {
      transform: translateY(4px);
      box-shadow:
        0 2px 0 #174d7d,
        0 4px 12px #0006,
        inset 0 3px 8px #ffffff66;
    }

    #jumpArrow {
      display: block;
      margin-bottom: -2px;
      font-size: 24px;
      line-height: 22px;
    }

    #inventoryButton {
      position: absolute;
      top: 14px;
      right: 14px;
      padding: 9px 13px;
      border: 1px solid #ffffff55;
      border-radius: 9px;
      background: #17231dcc;
      pointer-events: auto;
    }

    #hotbar {
      position: absolute;
      bottom: 12px;
      left: 50%;
      display: flex;
      gap: 4px;
      transform: translateX(-50%);
      pointer-events: auto;
    }

    .slot {
      position: relative;
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      border: 2px solid #ffffff66;
      border-radius: 8px;
      background: #15231dd9;
      font-size: 19px;
      text-align: center;
      cursor: pointer;
    }

    .slot.selected {
      border-color: #ffe66d;
      box-shadow: 0 0 10px #ffe66d99;
    }

    .slot small {
      position: absolute;
      right: 4px;
      bottom: 1px;
      font-size: 11px;
      text-shadow: 0 1px 3px #000;
    }

    #hint {
      position: absolute;
      top: 14px;
      left: 50%;
      padding: 7px 10px;
      transform: translateX(-50%);
      border-radius: 8px;
      background: #17231dbb;
      font-size: 12px;
      white-space: nowrap;
    }

    #toast {
      position: absolute;
      top: 18%;
      left: 50%;
      display: none;
      padding: 9px 14px;
      transform: translateX(-50%);
      border-radius: 9px;
      background: #17231de8;
    }

    #modal {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #0009;
      pointer-events: auto;
    }

    #panel {
      width: min(94vw, 520px);
      max-height: 92vh;
      overflow: auto;
      padding: 14px;
      border: 1px solid #ffffff55;
      border-radius: 12px;
      background: #1c2a22;
    }

    #panelHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    #panel h2 {
      margin: 0;
      font-size: 18px;
    }

    #closeModal {
      padding: 8px 12px;
      border-radius: 8px;
      background: #80504b;
    }

    #playerGrid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
    }

    #playerGrid .slot {
      width: 100%;
      height: 54px;
    }

    #rotate {
      display: none;
    }

    @media (orientation: portrait) {
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px;
        background: #14221b;
        text-align: center;
        font-size: 20px;
      }
    }

    @media (max-height: 430px) {
      #jump {
        right: 16px;
        bottom: 17px;
        width: 70px;
        height: 70px;
      }

      #hotbar { bottom: 7px; }
      .slot { width: 42px; height: 42px; }
      #hint { top: 7px; }
    }

    @media (max-width: 700px) {
      #hotbar { gap: 3px; }
      .slot { width: 42px; height: 44px; }
    }
  </style>
</head>
<body>
  <div id="rotate">Поверните устройство в альбомную ориентацию</div>

  <div id="ui">
    <div id="crosshair"></div>

    <div id="targetBox">
      <div id="targetName"></div>
      <button id="interact">Взять</button>
    </div>

    <div id="joystick">
      <div id="stick"></div>
    </div>

    <button id="jump">
      <span><span id="jumpArrow">⬆</span>ПРЫЖОК</span>
    </button>

    <button id="inventoryButton">Инвентарь</button>
    <div id="hotbar"></div>
    <div id="hint">Слева — движение · справа — обзор</div>
    <div id="toast"></div>

    <div id="modal">
      <div id="panel">
        <div id="panelHeader">
          <h2>Инвентарь · 30 слотов</h2>
          <button id="closeModal">Закрыть</button>
        </div>
        <div id="playerGrid"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.Fog(0x87ceeb, 35, 100);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 150);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xdff4ff, 0x53613d, 2));

    const sun = new THREE.DirectionalLight(0xfff1d0, 2.2);
    sun.position.set(-15, 25, 12);
    sun.castShadow = true;
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x5c9b50, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const player = {
      x: 0,
      z: 8,
      y: 0,
      vy: 0,
      yaw: 0,
      pitch: 0,
      grounded: true
    };

    const pickups = [];
    const raycaster = new THREE.Raycaster();
    raycaster.far = 3.5;

    const playerItems = Array(30).fill(null);
    const itemNames = {
      wood: "Ветка",
      stone: "Маленький камень"
    };
    const itemIcons = {
      wood: "🪵",
      stone: "🪨"
    };

    let currentTarget = null;
    let selectedSlot = -1;
    let modalOpen = false;
    let toastTimer;
    let walkTime = 0;

    function notify(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.style.display = "none";
      }, 1400);
    }

    function addToInventory(type, amount) {
      let left = amount;

      for (const slot of playerItems) {
        if (slot && slot.type === type && slot.count < 99) {
          const added = Math.min(left, 99 - slot.count);
          slot.count += added;
          left -= added;
          if (left === 0) break;
        }
      }

      while (left > 0) {
        const emptyIndex = playerItems.findIndex(slot => slot === null);
        if (emptyIndex === -1) break;

        const added = Math.min(left, 99);
        playerItems[emptyIndex] = { type, count: added };
        left -= added;
      }

      renderHotbar();
      renderInventory();

      if (left > 0) notify("Инвентарь заполнен");
      return amount - left;
    }

    // Большие деревья и камни — только декорации. Их нельзя добывать.
    function makeTree(x, z) {
      const root = new THREE.Group();
      root.position.set(x, 0, z);

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25, 0.38, 2.1, 7),
        new THREE.MeshStandardMaterial({ color: 0x76502d })
      );
      trunk.position.y = 1.05;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      root.add(trunk);

      const leaves = new THREE.Mesh(
        new THREE.ConeGeometry(1.25, 3.1, 8),
        new THREE.MeshStandardMaterial({ color: 0x287a3e })
      );
      leaves.position.y = 3.1;
      leaves.castShadow = true;
      root.add(leaves);

      scene.add(root);
    }

    function makeLargeRock(x, z) {
      const root = new THREE.Group();
      root.position.set(x, 0, z);

      const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(0.8, 1),
        new THREE.MeshStandardMaterial({ color: 0x858b8e, roughness: 1 })
      );
      rock.position.y = 0.55;
      rock.scale.set(1.2, 0.8, 1);
      rock.castShadow = true;
      rock.receiveShadow = true;
      root.add(rock);

      scene.add(root);
    }

    function makePickup(type, x, z, rotation = Math.random() * Math.PI) {
      const root = new THREE.Group();
      root.position.set(x, 0.06, z);
      root.rotation.y = rotation;

      if (type === "wood") {
        const branch = new THREE.Mesh(
          new THREE.CylinderGeometry(0.045, 0.065, 0.68, 6),
          new THREE.MeshStandardMaterial({ color: 0x82572f })
        );
        branch.rotation.z = Math.PI / 2;
        branch.rotation.y = 0.2;
        branch.position.y = 0.07;
        branch.castShadow = true;
        root.add(branch);

        const end = new THREE.Mesh(
          new THREE.CylinderGeometry(0.065, 0.065, 0.08, 6),
          new THREE.MeshStandardMaterial({ color: 0xb18455 })
        );
        end.rotation.z = Math.PI / 2;
        end.position.set(0.34, 0.07, 0);
        root.add(end);
      } else {
        const stone = new THREE.Mesh(
          new THREE.DodecahedronGeometry(0.19, 0),
          new THREE.MeshStandardMaterial({ color: 0x858b8e, roughness: 1 })
        );
        stone.position.y = 0.13;
        stone.scale.set(1.25, 0.72, 1);
        stone.castShadow = true;
        root.add(stone);

        const smallerStone = new THREE.Mesh(
          new THREE.DodecahedronGeometry(0.105, 0),
          new THREE.MeshStandardMaterial({ color: 0x9ca1a2, roughness: 1 })
        );
        smallerStone.position.set(0.18, 0.08, 0.1);
        root.add(smallerStone);
      }

      const pickup = {
        type,
        name: itemNames[type],
        root
      };

      root.traverse(object => {
        if (object.isMesh) object.userData.pickup = pickup;
      });

      scene.add(root);
      pickups.push(pickup);
    }

    // Деревья и крупные камни оставлены на карте, но не доступны для добычи.
    [
      [-7, -4], [-5, 4], [-9, 7], [5, -6], [9, 1], [7, 9],
      [-2, -10], [12, -8], [-12, -2], [3, 13], [-13, 10], [14, 6]
    ].forEach(([x, z], index) => {
      if (index % 2 === 0) makeTree(x, z);
      else makeLargeRock(x, z);
    });

    // Ветки и маленькие камни лежат на земле и подбираются отдельно.
    [
      ["wood", -3, 5], ["stone", 2, 3], ["wood", 4, 7],
      ["stone", -6, 1], ["wood", 8, -2], ["stone", 6, 4],
      ["wood", -1, -5], ["stone", 10, 5], ["wood", -10, 3],
      ["stone", -4, 10], ["wood", 12, 1], ["stone", 1, 12],
      ["wood", 5, -10], ["stone", -11, -5], ["wood", 9, 11],
      ["stone", -7, -9], ["wood", -2, 13], ["stone", 13, -5]
    ].forEach(([type, x, z]) => makePickup(type, x, z));

    // Простая модель рук и ног от первого лица, прикреплённая к камере.
    const viewModel = new THREE.Group();
    camera.add(viewModel);
    scene.add(camera);

    function makeLimb(parent, color, length, radius, x, y, z, rotationZ = 0) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.rotation.z = rotationZ;

      const limb = new THREE.Mesh(
        new THREE.CylinderGeometry(radius * 0.82, radius, length, 8),
        new THREE.MeshStandardMaterial({ color, roughness: 0.9 })
      );
      limb.position.y = -length / 2;
      group.add(limb);

      parent.add(group);
      return group;
    }

    const leftLeg = makeLimb(viewModel, 0x334a6b, 0.8, 0.12, -0.19, -0.7, -0.72);
    const rightLeg = makeLimb(viewModel, 0x334a6b, 0.8, 0.12, 0.19, -0.7, -0.72);

    function makeFoot(x) {
      const foot = new THREE.Mesh(
        new THREE.BoxGeometry(0.21, 0.12, 0.34),
        new THREE.MeshStandardMaterial({ color: 0x29251f, roughness: 1 })
      );
      foot.position.set(x, -1.12, -0.92);
      viewModel.add(foot);
      return foot;
    }

    const leftFoot = makeFoot(-0.19);
    const rightFoot = makeFoot(0.19);

    const leftArm = makeLimb(viewModel, 0xc98e69, 0.63, 0.105, -0.47, -0.38, -0.75, -0.28);
    const rightArm = makeLimb(viewModel, 0xc98e69, 0.63, 0.105, 0.47, -0.38, -0.75, 0.28);

    const leftHand = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 10, 8),
      new THREE.MeshStandardMaterial({ color: 0xd5a17b })
    );
    leftHand.position.set(-0.52, -0.75, -0.78);
    viewModel.add(leftHand);

    const rightHand = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 10, 8),
      new THREE.MeshStandardMaterial({ color: 0xd5a17b })
    );
    rightHand.position.set(0.52, -0.75, -0.78);
    viewModel.add(rightHand);

    const heldObject = new THREE.Group();
    heldObject.position.set(0.58, -0.72, -0.96);
    viewModel.add(heldObject);

    function setHeldItem(type) {
      heldObject.clear();

      if (type === "stone") {
        const stone = new THREE.Mesh(
          new THREE.DodecahedronGeometry(0.16, 0),
          new THREE.MeshStandardMaterial({ color: 0x858b8e, roughness: 1 })
        );
        stone.scale.set(1.1, 0.8, 0.8);
        heldObject.add(stone);
      } else if (type === "wood") {
        const branch = new THREE.Mesh(
          new THREE.CylinderGeometry(0.045, 0.06, 0.55, 7),
          new THREE.MeshStandardMaterial({ color: 0x82572f })
        );
        branch.rotation.x = Math.PI / 2;
        branch.rotation.z = -0.5;
        heldObject.add(branch);
      }
    }

    function getSelectedItemType() {
      if (selectedSlot < 0 || !playerItems[selectedSlot]) return null;
      return playerItems[selectedSlot].type;
    }

    function setCamera() {
      camera.position.set(player.x, 1.65 + player.y, player.z);
      camera.rotation.order = "YXZ";
      camera.rotation.y = player.yaw;
      camera.rotation.x = player.pitch;
    }

    function getTarget() {
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const objects = pickups.flatMap(pickup => pickup.root.children);
      const hits = raycaster.intersectObjects(objects, true);

      for (const hit of hits) {
        const pickup = hit.object.userData.pickup;
        if (pickup && camera.position.distanceTo(hit.point) <= 3.5) {
          return pickup;
        }
      }
      return null;
    }

    function updateTarget() {
      currentTarget = modalOpen ? null : getTarget();

      const box = document.getElementById("targetBox");
      if (!currentTarget) {
        box.style.display = "none";
        return;
      }

      box.style.display = "block";
      document.getElementById("targetName").textContent = currentTarget.name;
    }

    function collectTarget() {
      if (!currentTarget || modalOpen) return;

      const item = currentTarget;
      const added = addToInventory(item.type, 1);

      if (added > 0) {
        scene.remove(item.root);
        const index = pickups.indexOf(item);
        if (index !== -1) pickups.splice(index, 1);
        notify(`Подобрано: ${item.name}`);
      }

      updateTarget();
    }

    document.getElementById("interact").addEventListener("click", collectTarget);

    function openInventory() {
      modalOpen = true;
      document.getElementById("modal").style.display = "flex";
      renderInventory();
    }

    function closeInventory() {
      modalOpen = false;
      document.getElementById("modal").style.display = "none";
      selectedSlot = -1;
      renderHotbar();
    }

    document.getElementById("inventoryButton").addEventListener("click", openInventory);
    document.getElementById("closeModal").addEventListener("click", closeInventory);
    document.getElementById("modal").addEventListener("click", event => {
      if (event.target.id === "modal") closeInventory();
    });

    function renderHotbar() {
      const bar = document.getElementById("hotbar");
      bar.innerHTML = "";

      for (let i = 0; i < 8; i++) {
        const element = document.createElement("div");
        element.className = `slot ${selectedSlot === i ? "selected" : ""}`;

        if (playerItems[i]) {
          element.innerHTML = `${itemIcons[playerItems[i].type]}<small>${playerItems[i].count}</small>`;
        } else {
          element.textContent = String(i + 1);
        }

        element.addEventListener("click", () => {
          selectedSlot = i;
          setHeldItem(getSelectedItemType());
          renderHotbar();
          renderInventory();
        });

        bar.appendChild(element);
      }

      setHeldItem(getSelectedItemType());
    }

    function renderInventory() {
      const grid = document.getElementById("playerGrid");
      grid.innerHTML = "";

      playerItems.forEach((item, index) => {
        const element = document.createElement("div");
        element.className = `slot ${selectedSlot === index ? "selected" : ""}`;

        if (item) {
          element.innerHTML = `${itemIcons[item.type]}<small>${item.count}</small>`;
        } else {
          element.textContent = String(index + 1);
        }

        element.addEventListener("click", () => {
          selectedSlot = index;
          setHeldItem(getSelectedItemType());
          renderHotbar();
          renderInventory();
        });

        grid.appendChild(element);
      });
    }

    document.getElementById("jump").addEventListener("pointerdown", event => {
      event.preventDefault();

      if (!modalOpen && player.grounded) {
        player.vy = 6.2;
        player.grounded = false;
      }
    });

    // Джойстик появляется под пальцем при касании любой точки левой четверти.
    const joystick = document.getElementById("joystick");
    const stick = document.getElementById("stick");
    const joy = {
      id: null,
      centerX: 0,
      centerY: 0,
      x: 0,
      y: 0,
      radius: 55
    };

    const leftZoneWidth = () => innerWidth * 0.25;

    function startJoystick(event) {
      if (joy.id !== null || modalOpen || event.clientX > leftZoneWidth()) return false;

      joy.id = event.pointerId;
      joy.centerX = event.clientX;
      joy.centerY = event.clientY;
      joy.x = 0;
      joy.y = 0;

      joystick.style.display = "block";
      joystick.style.left = `${joy.centerX}px`;
      joystick.style.top = `${joy.centerY}px`;
      stick.style.transform = "translate(0, 0)";

      event.preventDefault();
      return true;
    }

    function moveJoystick(event) {
      if (event.pointerId !== joy.id) return;

      const dx = event.clientX - joy.centerX;
      const dy = event.clientY - joy.centerY;
      const distance = Math.hypot(dx, dy);
      const scale = distance > joy.radius ? joy.radius / distance : 1;

      joy.x = dx * scale / joy.radius;
      joy.y = dy * scale / joy.radius;
      stick.style.transform = `translate(${dx * scale}px, ${dy * scale}px)`;
    }

    function endJoystick(event) {
      if (event.pointerId !== joy.id) return;

      joy.id = null;
      joy.x = 0;
      joy.y = 0;
      joystick.style.display = "none";
    }

    let lookPointer = null;
    let lastPointerX = 0;
    let lastPointerY = 0;

    renderer.domElement.addEventListener("pointerdown", event => {
      if (startJoystick(event)) return;

      if (event.clientX > leftZoneWidth() && !modalOpen) {
        lookPointer = event.pointerId;
        lastPointerX = event.clientX;
        lastPointerY = event.clientY;
        renderer.domElement.setPointerCapture(event.pointerId);
      }
    });

    window.addEventListener("pointermove", event => {
      moveJoystick(event);

      if (event.pointerId === lookPointer) {
        player.yaw -= (event.clientX - lastPointerX) * 0.005;
        player.pitch -= (event.clientY - lastPointerY) * 0.004;
        player.pitch = THREE.MathUtils.clamp(player.pitch, -1.25, 1.25);

        lastPointerX = event.clientX;
        lastPointerY = event.clientY;
      }
    });

    window.addEventListener("pointerup", event => {
      endJoystick(event);
      if (event.pointerId === lookPointer) lookPointer = null;
    });

    window.addEventListener("pointercancel", event => {
      endJoystick(event);
      if (event.pointerId === lookPointer) lookPointer = null;
    });

    const keys = {};

    window.addEventListener("keydown", event => {
      keys[event.code] = true;

      if (event.code === "Space" && player.grounded && !modalOpen) {
        player.vy = 6.2;
        player.grounded = false;
      }

      if (/^Digit[1-8]$/.test(event.code)) {
        selectedSlot = Number(event.code.slice(-1)) - 1;
        setHeldItem(getSelectedItemType());
        renderHotbar();
      }

      if (event.code === "Escape" && modalOpen) closeInventory();
    });

    window.addEventListener("keyup", event => {
      keys[event.code] = false;
    });

    function animateLimbs(moving, dt) {
      if (moving) {
        walkTime += dt * 10;
      }

      const swing = moving ? Math.sin(walkTime) * 0.35 : 0;

      leftLeg.rotation.x = swing;
      rightLeg.rotation.x = -swing;
      leftFoot.rotation.x = swing * 0.5;
      rightFoot.rotation.x = -swing * 0.5;
      leftArm.rotation.x = -swing * 0.6;
      rightArm.rotation.x = swing * 0.6;
    }

    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      let moving = false;

      if (!modalOpen) {
        let forward = -joy.y;
        let strafe = joy.x;

        if (keys.KeyW || keys.ArrowUp) forward += 1;
        if (keys.KeyS || keys.ArrowDown) forward -= 1;
        if (keys.KeyD || keys.ArrowRight) strafe += 1;
        if (keys.KeyA || keys.ArrowLeft) strafe -= 1;

        const magnitude = Math.hypot(forward, strafe);

        if (magnitude > 1) {
          forward /= magnitude;
          strafe /= magnitude;
        }

        moving = magnitude > 0.05;

        const speed = 5.2;
        player.x += (
          Math.sin(player.yaw) * forward +
          Math.cos(player.yaw) * strafe
        ) * speed * dt;

        player.z += (
          -Math.cos(player.yaw) * forward +
          Math.sin(player.yaw) * strafe
        ) * speed * dt;

        // Гравитация и плавный прыжок с земли.
        player.vy -= 17 * dt;
        player.y += player.vy * dt;

        if (player.y <= 0) {
          player.y = 0;
          player.vy = 0;
          player.grounded = true;
        }
      }

      animateLimbs(moving && !modalOpen, dt);
      setCamera();
      updateTarget();
      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    }

    window.addEventListener("resize", resize);

    renderHotbar();
    renderInventory();
  </script>
</body>
</html>
