<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Выживание (База)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: sans-serif; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }

        /* Интерфейс */
        #hud {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0, 0, 0, 0.5); color: white;
            padding: 10px 15px; border-radius: 10px; font-size: 16px;
            pointer-events: none;
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; background: rgba(255, 255, 255, 0.8);
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #take-btn {
            display: none; position: absolute; bottom: 40px; right: 40px;
            padding: 15px 25px; background: #ff9800; color: white;
            border: 2px solid white; border-radius: 12px; font-size: 18px; font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4); z-index: 10;
        }
        #take-btn:active { transform: scale(0.95); background: #e68900; }

        /* Визуал джойстика */
        #joy-base {
            display: none; position: absolute; width: 100px; height: 100px;
            background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
        }
        #joy-stick {
            position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
            background: rgba(255, 255, 255, 0.7); border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #hint {
            position: absolute; bottom: 10px; left: 15px; color: rgba(255,255,255,0.8);
            font-size: 12px; pointer-events: none; text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

<div id="hud">🪵 Дерево: <span id="wood">0</span> | 🪨 Камень: <span id="stone">0</span></div>
<div id="crosshair"></div>
<button id="take-btn">Взять</button>
<div id="joy-base"><div id="joy-stick"></div></div>
<div id="hint">Левая часть — ходить | Правая — камера</div>

<!-- Подключаем Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // 1. НАСТРОЙКА СЦЕНЫ И КАМЕРЫ
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Голубое небо
    scene.fog = new THREE.Fog(0x87CEEB, 15, 65);  // Лёгкий туман вдалеке

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.7, 0); // Рост игрока 1.7м
    camera.rotation.order = 'YXZ';  // Чтобы камера вращалась правильно без завалов

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Оптимизация под экран телефона
    document.body.appendChild(renderer.domElement);

    // 2. СВЕТ
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // 3. ЗЕМЛЯ
    const groundGeo = new THREE.PlaneGeometry(150, 150);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x4caf50 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 4. СПАВН РЕСУРСОВ (Дерево и Камень)
    const items = [];
    const woodGeo = new THREE.BoxGeometry(0.8, 0.4, 0.4);
    const woodMat = new THREE.MeshLambertMaterial({ color: 0x8d5524 });
    const stoneGeo = new THREE.DodecahedronGeometry(0.4);
    const stoneMat = new THREE.MeshLambertMaterial({ color: 0x808080 });

    function spawnResources() {
        for (let i = 0; i < 30; i++) {
            const isWood = Math.random() > 0.5;
            const mesh = new THREE.Mesh(isWood ? woodGeo : stoneGeo, isWood ? woodMat : stoneMat);
            mesh.position.set(
                (Math.random() - 0.5) * 60,
                0.25,
                (Math.random() - 0.5) * 60
            );
            mesh.rotation.y = Math.random() * Math.PI;
            mesh.userData = { type: isWood ? 'wood' : 'stone' };
            scene.add(mesh);
            items.push(mesh);
        }
    }
    spawnResources();

    // 5. УПРАВЛЕНИЕ (СЕНСОРНОЕ: ДЖОЙСТИК + КАМЕРА)
    let moveInput = { x: 0, z: 0 };
    let yaw = 0, pitch = 0;
    let joyTouchId = null, lookTouchId = null;
    let joyStart = { x: 0, y: 0 }, lookLast = { x: 0, y: 0 };

    const joyBase = document.getElementById('joy-base');
    const joyStick = document.getElementById('joy-stick');

    window.addEventListener('touchstart', (e) => {
        for (let touch of e.changedTouches) {
            // Левая половина экрана -> Джойстик
            if (touch.clientX < window.innerWidth / 2 && joyTouchId === null) {
                joyTouchId = touch.identifier;
                joyStart = { x: touch.clientX, y: touch.clientY };
                joyBase.style.display = 'block';
                joyBase.style.left = touch.clientX + 'px';
                joyBase.style.top = touch.clientY + 'px';
                joyStick.style.transform = 'translate(-50%, -50%)';
            } 
            // Правая половина экрана -> Поворот камеры
            else if (touch.clientX >= window.innerWidth / 2 && lookTouchId === null) {
                lookTouchId = touch.identifier;
                lookLast = { x: touch.clientX, y: touch.clientY };
            }
        }
    });

    window.addEventListener('touchmove', (e) => {
        for (let touch of e.changedTouches) {
            if (touch.identifier === joyTouchId) {
                const maxDist = 40;
                let dx = touch.clientX - joyStart.x;
                let dy = touch.clientY - joyStart.y;
                const dist = Math.hypot(dx, dy);
                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }
                joyStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                moveInput.x = dx / maxDist;
                moveInput.z = dy / maxDist;
            }
            if (touch.identifier === lookTouchId) {
                const dx = touch.clientX - lookLast.x;
                const dy = touch.clientY - lookLast.y;
                lookLast = { x: touch.clientX, y: touch.clientY };

                yaw -= dx * 0.005;
                pitch -= dy * 0.005;
                pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch)); // Ограничение верха/низа
            }
        }
    });

    window.addEventListener('touchend', (e) => {
        for (let touch of e.changedTouches) {
            if (touch.identifier === joyTouchId) {
                joyTouchId = null;
                moveInput = { x: 0, z: 0 };
                joyBase.style.display = 'none';
            }
            if (touch.identifier === lookTouchId) {
                lookTouchId = null;
            }
        }
    });

    // 6. ПОДБОР ПРЕДМЕТОВ И ИНВЕНТАРЬ
    let inventory = { wood: 0, stone: 0 };
    let nearestItem = null;
    const takeBtn = document.getElementById('take-btn');

    takeBtn.addEventListener('touchstart', (e) => {
        e.stopPropagation(); // Чтобы нажатие кнопки не крутило камеру
        if (nearestItem) {
            inventory[nearestItem.userData.type]++;
            document.getElementById('wood').innerText = inventory.wood;
            document.getElementById('stone').innerText = inventory.stone;

            scene.remove(nearestItem);
            items.splice(items.indexOf(nearestItem), 1);
            nearestItem = null;
            takeBtn.style.display = 'none';
        }
    });

    // 7. ИГРОВОЙ ЦИКЛ (FPS)
    const speed = 0.12;
    function animate() {
        requestAnimationFrame(animate);

        // Применяем поворот камеры
        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        // Движение относительно взгляда игрока
        if (moveInput.x !== 0 || moveInput.z !== 0) {
            const forwardX = -Math.sin(yaw);
            const forwardZ = -Math.cos(yaw);
            const rightX = Math.cos(yaw);
            const rightZ = -Math.sin(yaw);

            camera.position.x += (forwardX * -moveInput.z + rightX * moveInput.x) * speed;
            camera.position.z += (forwardZ * -moveInput.z + rightZ * moveInput.x) * speed;
        }

        // Поиск ближайшего ресурса в радиусе 2.5 метров
        nearestItem = null;
        let minDist = 2.5;
        for (let item of items) {
            const dist = Math.hypot(camera.position.x - item.position.x, camera.position.z - item.position.z);
            if (dist < minDist) {
                minDist = dist;
                nearestItem = item;
            }
        }
        takeBtn.style.display = nearestItem ? 'block' : 'none';

        renderer.render(scene, camera);
    }

    // Адаптация при повороте экрана
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
