<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Выживание</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101820; font-family: system-ui, sans-serif; color: white; }
    canvas { display: block; touch-action: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #aim {
      position: absolute; left: 50%; top: 50%; width: 12px; height: 12px;
      transform: translate(-50%, -50%); border: 2px solid #fff; border-radius: 50%;
      box-shadow: 0 0 4px #000;
    }
    #aim::after, #aim::before { content: ""; position: absolute; background: white; }
    #aim::after { width: 2px; height: 20px; left: 3px; top: -6px; }
    #aim::before { height: 2px; width: 20px; top: 3px; left: -6px; }
    #target {
      position: absolute; left: 50%; top: calc(50% + 28px); transform: translateX(-50%);
      display: none; padding: 10px 14px; border-radius: 12px;
      background: #17231eeF; border: 1px solid #ffffff44; text-align: center;
      min-width: 150px; pointer-events: auto;
    }
    #target strong { display: block; margin-bottom: 6px; }
    button { border: 0; border-radius: 9px; padding: 8px 18px; background: #7ac943; color: #13200d; font-weight: 800; font-size: 15px; }
    #hint { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); color: #fff; text-shadow: 0 2px 4px #000; font-size: 13px; white-space: nowrap; }
    #hotbar { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: auto; }
    .slot { width: 58px; height: 58px; border: 2px solid #ffffff80; border-radius: 10px; background: #15201dcc; display: grid; place-items: center; position: relative; font-size: 22px; }
    .slot.selected { border-color: #b7ff72; box-shadow: 0 0 10px #9cff4c; }
    .count { position: absolute; right: 4px; bottom: 1px; font-size: 12px; font-weight: 800; text-shadow: 0 1px 3px #000; }
    #joystick {
      position: absolute; left: 22px; bottom: 22px; width: 116px; height: 116px; border-radius: 50%;
      background: #ffffff22; border: 2px solid #ffffff55; pointer-events: auto; touch-action: none;
    }
    #stick { position: absolute; width: 48px; height: 48px; left: 32px; top: 32px; border-radius: 50%; background: #ffffffa8; border: 2px solid white; }
    #lookArea { position: absolute; right: 0; top: 0; width: 62%; height: 100%; pointer-events: auto; touch-action: none; }
    #rotate { display: none; position: fixed; inset: 0; z-index: 5; background: #101820; align-items: center; justify-content: center; text-align: center; padding: 28px; font-size: 20px; }
    @media (orientation: portrait) { #rotate { display: flex; } }
    @media (max-height: 430px) {
      #joystick { width: 96px; height: 96px; left: 14px; bottom: 12px; }
      #stick { left: 24px; top: 24px; }
      .slot { width: 48px; height: 48px; }
      #hotbar { bottom: 8px; }
    }
  </style>
</head>
<body>
  <div id="rotate">Поверните устройство в альбомную ориентацию</div>
  <div id="ui">
    <div id="lookArea"></div>
    <div id="hint">Левый джойстик — ходьба · Свайп справа — камера</div>
    <div id="aim"></div>
    <div id="target"><strong id="targetName"></strong><button id="take">Взять</button></div>
    <div id="joystick"><div id="stick"></div></div>
    <div id="hotbar"></div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module">
    import * as THREE from "three";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9bc7d7);
    scene.fog = new THREE.Fog(0x9bc7d7, 35, 100);

    const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 150);
    camera.rotation.order = "YXZ";
    camera.position.set(0, 1.65, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xd8efff, 0x52603c, 2));
    const sun = new THREE.DirectionalLight(0xffedc4, 2.2);
    sun.position.set(-12, 22, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(140, 140),
      new THREE.MeshStandardMaterial({ color: 0x587744, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Небольшие пятна травы для разнообразия поверхности.
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x6d8d4e, roughness: 1 });
    for (let i = 0; i < 180; i++) {
      const patch = new THREE.Mesh(new THREE.CircleGeometry(0.25 + Math.random() * 0.8, 7), grassMat);
      patch.rotation.x = -Math.PI / 2;
      patch.position.set((Math.random() - 0.5) * 90, 0.012, (Math.random() - 0.5) * 90);
      scene.add(patch);
    }

    const resources = [];
    const materials = {
      trunk: new THREE.MeshStandardMaterial({ color: 0x765034, roughness: 1 }),
      leaves: new THREE.MeshStandardMaterial({ color: 0x315e35, roughness: 1 }),
      stone: new THREE.MeshStandardMaterial({ color: 0x858a8d, roughness: 1 })
    };

    function addTree(x, z) {
      const root = new THREE.Group();
      root.position.set(x, 0, z);
      root.userData = { kind: "wood", title: "Дерево", amount: 1 };
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.32, 2.2, 7), materials.trunk);
      trunk.position.y = 1.1; trunk.castShadow = true; trunk.receiveShadow = true; root.add(trunk);
      for (const [y, scale] of [[2.3, 1.35], [3.1, 1.05], [3.8, 0.7]]) {
        const leaves = new THREE.Mesh(new THREE.ConeGeometry(scale, 1.8, 7), materials.leaves);
        leaves.position.y = y; leaves.castShadow = true; root.add(leaves);
      }
      scene.add(root); resources.push(root);
    }

    function addRock(x, z) {
      const root = new THREE.Group();
      root.position.set(x, 0, z);
      root.userData = { kind: "stone", title: "Камень", amount: 1 };
      const mesh = new THREE.Mesh(new THREE.DodecahedronGeometry(0.72, 0), materials.stone);
      mesh.scale.set(1.25, 0.8, 1);
      mesh.position.y = 0.52; mesh.rotation.set(Math.random(), Math.random(), Math.random());
      mesh.castShadow = true; mesh.receiveShadow = true; root.add(mesh);
      scene.add(root); resources.push(root);
    }

    // Ресурсы появляются вокруг стартовой площадки.
    for (let i = 0; i < 24; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 6 + Math.random() * 27;
      const x = Math.cos(angle) * radius, z = Math.sin(angle) * radius;
      Math.random() < 0.58 ? addTree(x, z) : addRock(x, z);
    }

    const inventory = { wood: 0, stone: 0 };
    const slots = [
      { icon: "🪵", label: "Дерево", key: "wood" },
      { icon: "🪨", label: "Камень", key: "stone" },
      { icon: "🧰", label: "Слот 3", key: null },
      { icon: "🎒", label: "Слот 4", key: null }
    ];
    let selectedSlot = 0;
    const hotbar = document.querySelector("#hotbar");

    function drawHotbar() {
      hotbar.innerHTML = "";
      slots.forEach((slot, i) => {
        const el = document.createElement("div");
        el.className = "slot" + (i === selectedSlot ? " selected" : "");
        el.title = slot.label;
        el.innerHTML = `${slot.icon}${slot.key ? `<span class="count">${inventory[slot.key]}</span>` : ""}`;
        el.addEventListener("pointerdown", e => {
          e.stopPropagation();
          selectedSlot = i;
          drawHotbar();
        });
        hotbar.appendChild(el);
      });
    }
    drawHotbar();

    const joystick = document.querySelector("#joystick");
    const stick = document.querySelector("#stick");
    const lookArea = document.querySelector("#lookArea");
    const targetPanel = document.querySelector("#target");
    const targetName = document.querySelector("#targetName");
    let moveX = 0, moveY = 0, yaw = 0, pitch = 0;
    let activeTarget = null;
    const raycaster = new THREE.Raycaster();
    raycaster.far = 3.5;

    joystick.addEventListener("pointerdown", e => {
      e.preventDefault(); joystick.setPointerCapture(e.pointerId); updateStick(e);
    });
    joystick.addEventListener("pointermove", e => {
      if (joystick.hasPointerCapture(e.pointerId)) updateStick(e);
    });
    function updateStick(e) {
      const r = joystick.getBoundingClientRect();
      let x = e.clientX - (r.left + r.width / 2);
      let y = e.clientY - (r.top + r.height / 2);
      const max = r.width * 0.34, len = Math.hypot(x, y);
      if (len > max) { x *= max / len; y *= max / len; }
      stick.style.transform = `translate(${x}px, ${y}px)`;
      moveX = x / max; moveY = y / max;
    }
    function resetStick() {
      moveX = moveY = 0;
      stick.style.transform = "";
    }
    joystick.addEventListener("pointerup", resetStick);
    joystick.addEventListener("pointercancel", resetStick);

    let lookPointer = null, lastX = 0, lastY = 0;
    lookArea.addEventListener("pointerdown", e => {
      if (e.target.closest("#target")) return;
      lookPointer = e.pointerId; lastX = e.clientX; lastY = e.clientY;
      lookArea.setPointerCapture(e.pointerId);
    });
    lookArea.addEventListener("pointermove", e => {
      if (e.pointerId !== lookPointer) return;
      yaw -= (e.clientX - lastX) * 0.004;
      pitch -= (e.clientY - lastY) * 0.004;
      pitch = THREE.MathUtils.clamp(pitch, -1.35, 1.35);
      lastX = e.clientX; lastY = e.clientY;
      camera.rotation.set(pitch, yaw, 0);
    });
    lookArea.addEventListener("pointerup", () => lookPointer = null);
    lookArea.addEventListener("pointercancel", () => lookPointer = null);

    document.querySelector("#take").addEventListener("click", () => {
      if (!activeTarget || !resources.includes(activeTarget)) return;
      const data = activeTarget.userData;
      inventory[data.kind] += data.amount;
      scene.remove(activeTarget);
      resources.splice(resources.indexOf(activeTarget), 1);
      activeTarget = null;
      targetPanel.style.display = "none";
      drawHotbar();
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      // Ходьба относительно направления взгляда.
      const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      camera.position.addScaledVector(forward, -moveY * 4.2 * dt);
      camera.position.addScaledVector(right, moveX * 4.2 * dt);
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, -65, 65);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, -65, 65);

      // Прицел проверяет ближайший объект и его расстояние.
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
      const hits = raycaster.intersectObjects(resources, true);
      let found = null;
      for (const hit of hits) {
        let node = hit.object;
        while (node && !node.userData.kind) node = node.parent;
        if (node && camera.position.distanceTo(node.position) <= 3.5) {
          found = node;
          break;
        }
      }
      activeTarget = found;
      if (found) {
        targetName.textContent = found.userData.title;
        targetPanel.style.display = "block";
      } else {
        targetPanel.style.display = "none";
      }

      renderer.render(scene, camera);
    }
    animate();

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
