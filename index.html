<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Выживание (Стиль Oxide / Free Fire)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; font-family: sans-serif; touch-action: none; }
        canvas { display: block; width: 100%; height: 100%; }

        /* Верхняя мини-статистика */
        #top-hud {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.7); color: white;
            padding: 6px 12px; border-radius: 6px; font-size: 13px;
            pointer-events: none; border: 1px solid rgba(255,255,255,0.2);
            z-index: 10;
        }

        /* Прицел по центру */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; background: rgba(255, 255, 255, 0.9);
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; border: 1px solid rgba(0,0,0,0.8);
        }

        /* Квадратик-лут меню (как на скрине из игр) при наведении на предмет */
        #loot-box {
            display: none; position: absolute; top: 58%; left: 50%;
            transform: translate(-50%, 0);
            background: rgba(30, 30, 30, 0.9); border: 2px solid #ff9800;
            border-radius: 10px; padding: 10px 15px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); z-index: 20;
        }
        #loot-title { color: #ffcc00; font-size: 14px; font-weight: bold; margin-bottom: 8px; }
        #loot-btn {
            background: #ff9800; color: white; border: none;
            padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: bold;
        }
        #loot-btn:active { background: #e68900; transform: scale(0.95); }

        /* Нижний хотбар инвентаря (как в выживачах) */
        #hotbar {
            position: absolute; bottom: 15px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 10;
            pointer-events: none;
        }
        .slot {
            width: 50px; height: 50px; background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 8px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; font-size: 11px; font-weight: bold;
        }
        .slot span { font-size: 13px; color: #ffcc00; }

        /* Джойстик слева */
        #joy-base {
            display: none; position: absolute; width: 110px; height: 110px;
            background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
        }
        #joy-stick {
            position: absolute; top: 50%; left: 50%; width: 45px; height: 45px;
            background: rgba(255, 255, 255, 0.7); border-radius: 50%;
            transform: translate(-50%, -50%); box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        #hint {
            position: absolute; top: 10px; right: 10px; color: rgba(255,255,255,0.7);
            font-size: 11px; pointer-events: none; text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

<div id="top-hud">FPS / Сурвайвал База</div>
<div id="crosshair"></div>
<div id="hint">Левая половина — ходьба | Правая — обзор</div>

<!-- Квадратик подбора предмета -->
<div id="loot-box">
    <div id="loot-title">🪨 Камень</div>
    <button id="loot-btn">ВЗЯТЬ</button>
</div>

<!-- Нижний инвентарь (Хотбар) -->
<div id="hotbar">
    <div class="slot">🪵<span id="wood-count">0</span></div>
    <div class="slot">🪨<span id="stone-count">0</span></div>
    <div class="slot">3</div>
    <div class="slot">4</div>
</div>

<div id="joy-base"><div id="joy-stick"></div></div>

<!-- Подключаем Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
    // 1. СЦЕНА И КАМЕРА
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 15, 60);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.7, 0);
    camera.rotation.order = 'YXZ';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // 2. СВЕТ
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    scene.add(dirLight);

    // 3. ЗЕМЛЯ
    const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(150, 150),
        new THREE.MeshLambertMaterial({ color: 0x4caf50 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 4. СПАВН РЕСУРСОВ
    const items = [];
    const woodGeo = new THREE.BoxGeometry(0.9, 0.5, 0.5);
    const woodMat = new THREE.MeshLambertMaterial({ color: 0x8d5524 });
    const stoneGeo = new THREE.DodecahedronGeometry(0.5);
    const stoneMat = new THREE.MeshLambertMaterial({ color: 0x808080 });

    function spawnResources() {
        for (let i = 0; i < 35; i++) {
            const isWood = Math.random() > 0.5;
            const mesh = new THREE.Mesh(isWood ? woodGeo : stoneGeo, isWood ? woodMat : stoneMat);
            mesh.position.set(
                (Math.random() - 0.5) * 60,
                0.25,
                (Math.random() - 0.5) * 60
            );
            mesh.rotation.y = Math.random() * Math.PI;
            mesh.userData = { 
                type: isWood ? 'wood' : 'stone',
                name: isWood ? '🪵 Дерево' : '🪨 Камень'
            };
            scene.add(mesh);
            items.push(mesh);
        }
    }
    spawnResources();

    // 5. УПРАВЛЕНИЕ (ДЖОЙСТИК СЛЕВА, ОБЗОР СПРАВА)
    let moveInput = { x: 0, z: 0 };
    let yaw = 0, pitch = 0;
    let joyTouchId = null, lookTouchId = null;
    let joyStart = { x: 0, y: 0 }, lookLast = { x: 0, y: 0 };

    const joyBase = document.getElementById('joy-base');
    const joyStick = document.getElementById('joy-stick');

    window.addEventListener('touchstart', (e) => {
        for (let touch of e.changedTouches) {
            if (touch.clientX < window.innerWidth / 2 && joyTouchId === null) {
                joyTouchId = touch.identifier;
                joyStart = { x: touch.clientX, y: touch.clientY };
                joyBase.style.display = 'block';
                joyBase.style.left = touch.clientX + 'px';
                joyBase.style.top = touch.clientY + 'px';
                joyStick.style.transform = 'translate(-50%, -50px)';
            } else if (touch.clientX >= window.innerWidth / 2 && lookTouchId === null) {
                lookTouchId = touch.identifier;
                lookLast = { x: touch.clientX, y: touch.clientY };
            }
        }
    });

    window.addEventListener('touchmove', (e) => {
        for (let touch of e.changedTouches) {
            if (touch.identifier === joyTouchId) {
                const maxDist = 45;
                let dx = touch.clientX - joyStart.x;
                let dy = touch.clientY - joyStart.y;
                const dist = Math.hypot(dx, dy);
                if (dist > maxDist) {
                    dx = (dx / dist) * maxDist;
                    dy = (dy / dist) * maxDist;
                }
                joyStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                moveInput.x = dx / maxDist;
                moveInput.z = dy / maxDist;
            }
            if (touch.identifier === lookTouchId) {
                const dx = touch.clientX - lookLast.x;
                const dy = touch.clientY - lookLast.y;
                lookLast = { x: touch.clientX, y: touch.clientY };

                yaw -= dx * 0.005;
                pitch -= dy * 0.005;
                pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
            }
        }
    });

    window.addEventListener('touchend', (e) => {
        for (let touch of e.changedTouches) {
            if (touch.identifier === joyTouchId) {
                joyTouchId = null;
                moveInput = { x: 0, z: 0 };
                joyBase.style.display = 'none';
            }
            if (touch.identifier === lookTouchId) {
                lookTouchId = null;
            }
        }
    });

    // 6. МЕХАНИКА ЛУТА И ИНВЕНТАРЬ
    let inventory = { wood: 0, stone: 0 };
    let currentLootItem = null;
    const lootBox = document.getElementById('loot-box');
    const lootTitle = document.getElementById('loot-title');
    const lootBtn = document.getElementById('loot-btn');

    const raycaster = new THREE.Raycaster();
    const centerScreen = new THREE.Vector2(0, 0);

    // Нажатие на кнопку «ВЗЯТЬ» в квадратике
    lootBtn.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        if (currentLootItem) {
            inventory[currentLootItem.userData.type]++;
            document.getElementById('wood-count').innerText = inventory.wood;
            document.getElementById('stone-count').innerText = inventory.stone;

            scene.remove(currentLootItem);
            items.splice(items.indexOf(currentLootItem), 1);
            currentLootItem = null;
            lootBox.style.display = 'none';
        }
    });

    const speed = 0.12;
    function animate() {
        requestAnimationFrame(animate);

        camera.rotation.y = yaw;
        camera.rotation.x = pitch;

        // Плавное движение ходьбы
        if (moveInput.x !== 0 || moveInput.z !== 0) {
            const forwardX = -Math.sin(yaw);
            const forwardZ = -Math.cos(yaw);
            const rightX = Math.cos(yaw);
            const rightZ = -Math.sin(yaw);

            camera.position.x += (forwardX * -moveInput.z + rightX * moveInput.x) * speed;
            camera.position.z += (forwardZ * -moveInput.z + rightZ * moveInput.x) * speed;
        }

        // Проверяем, на что смотрит центр прицела
        raycaster.setFromCamera(centerScreen, camera);
        const intersects = raycaster.intersectObjects(items);

        let found = null;
        if (intersects.length > 0) {
            const hit = intersects[0];
            if (camera.position.distanceTo(hit.object.position) < 3.5) {
                found = hit.object;
            }
        }

        if (found) {
            currentLootItem = found;
            lootTitle.innerText = found.userData.name;
            lootBox.style.display = 'block'; // Показываем тот самый квадратик лута!
        } else {
            currentLootItem = null;
            lootBox.style.display = 'none';
        }

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
